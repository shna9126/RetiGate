[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retigate"
version = "0.1.0"
description = "RetiGate: A Training-Free Bio-Inspired Motion-Saliency Pre-Filter for Foveated Object Detection"
authors = [
    {name = "Shivam", email = "shivam@example.com"},
]
dependencies = [
    "numpy",
    "opencv-python",
    "torch",
    "torchvision",
    "torchmetrics",
    "ultralytics",
    "pandas",
    "tqdm",
    "scipy",
    "matplotlib",
    "seaborn",
]
requires-python = ">=3.8"

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8",
]

[tool.setuptools]
packages = ["retigate"]